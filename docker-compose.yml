services:
  db:
    image: postgres:18.4-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - app_net
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build: .
    image: ghcr.io/dstordev/edu-bot:latest
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - TZ=Europe/Moscow
    networks:
      - app_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Сервис автообновления:
  watchtower:
    image: containrrr/watchtower
    restart: always
    profiles: ["prod"]
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Следит за обновлением образа бота раз в 60 сек
    command: --interval 60 --cleanup bot

volumes:
  postgres_data:
  redis_data:

networks:
  app_net:
    driver: bridge
